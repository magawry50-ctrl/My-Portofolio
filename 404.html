<!DOCTYPE html>
<html lang="ar" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | محمد المغاوري</title>
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-teal': '#14b8a6',
                    }
                }
            }
        }
    </script>
    
    <!-- Prevent Theme Flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        body {
            font-family: 'Almarai', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center p-6 antialiased dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-3xl p-8 md:p-10 shadow-xl border border-gray-100 dark:border-gray-700 text-center">
        <!-- Brand Badge -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 mb-6">
            <span class="material-symbols-outlined text-5xl">travel_explore</span>
        </div>

        <h1 class="text-6xl font-extrabold text-teal-600 dark:text-teal-400 mb-2">404</h1>
        
        <h2 class="text-2xl font-bold mb-3">الصفحة غير موجودة</h2>
        <p class="text-gray-600 dark:text-gray-400 mb-2 leading-relaxed">
            عذرًا، الصفحة أو الرابط الذي تحاول الوصول إليه غير موجود أو ربما تم نقله.
        </p>
        <p class="text-sm text-gray-400 dark:text-gray-500 mb-8">
            The page you are looking for doesn't exist or was relocated.
        </p>

        <a href="/" class="inline-flex items-center justify-center gap-2 w-full py-3.5 px-6 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-base transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
            <span class="material-symbols-outlined text-xl">home</span>
            العودة إلى الملف التعريفي
        </a>
    </div>

</body>
</html>
